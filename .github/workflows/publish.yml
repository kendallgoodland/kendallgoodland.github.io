name: Publish Quarto Website

on:
  workflow_dispatch:
  push:
    branches:
      - main
  
  
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      # Get repository files
      - name: Check out repository
        uses: actions/checkout@v4

      # Install Quarto
      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      # Install R
      - name: Install R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4'

      # Install required R packages
      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::rmarkdown
            any::knitr

      # Verify R packages
      - name: Verify R dependencies
        run: |
          Rscript -e 'library(rmarkdown); library(knitr); sessionInfo()'

      # Render Quarto website
      - name: Render website
        uses: quarto-dev/quarto-actions/render@v2

      # Upload generated website
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      # Publish website
      - name: Deploy website
        uses: actions/deploy-pages@v4
